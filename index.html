<style>
:root{
  --navy:#11161E; --navy2:#1A212C; --navy3:#27313F; --steel:#C9D2DC;
  --blue:#1F6FFF; --blue2:#3D8BFF; --blue-soft:#E8F0FF;
  --bg:#EEF3FA; --card:#FFFFFF; --text:#0E1A33; --muted:#6B7A99; --line:#E3E9F4;
  --green:#12B76A; --green-soft:#E3F8EE; --orange:#F79009; --orange-soft:#FEF3E2;
  --red:#F04438; --red-soft:#FEE9E7; --purple:#7A5AF8; --purple-soft:#EFEBFF;
  --r:16px; --sh:0 6px 24px rgba(16,40,90,.07); --sh2:0 14px 40px rgba(16,40,90,.16);
  --sbw:252px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px 24px;position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(620px 420px at 50% 26%,rgba(47,123,255,.30),transparent 65%),radial-gradient(900px 500px at 50% 110%,rgba(47,123,255,.16),transparent 60%),linear-gradient(180deg,#2A323D 0%,#1A2029 45%,#0F131A 100%)}
#login::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 7px)}
.login-hero{position:relative;width:min(340px,80vw);margin-bottom:18px;border-radius:26px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(201,210,220,.25),0 22px 50px rgba(0,0,0,.55),0 0 70px rgba(47,123,255,.28);animation:logoIn .9s cubic-bezier(.2,.8,.2,1) both}
.login-hero img{display:block;width:100%;height:auto;min-height:120px;background:#2A313B}
.login-hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.18) 48%,transparent 60%);background-size:250% 100%;
  animation:shine 5s ease-in-out 1.2s infinite}
@keyframes logoIn{from{opacity:0;transform:scale(.94) translateY(8px)}}
@keyframes shine{0%{background-position:150% 0}35%,100%{background-position:-60% 0}}
.login-card{position:relative;width:100%;max-width:400px;padding:22px 22px 20px;border-radius:22px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(201,210,220,.18);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.login-card h1{font-size:17px;font-weight:800;margin-bottom:2px;color:#EEF2F7}
.login-card p.sub{color:#9AA8BA;font-size:12.5px;margin-bottom:16px}
.lfield{display:flex;align-items:center;gap:10px;background:rgba(10,14,20,.45);border:1px solid rgba(201,210,220,.22);border-radius:14px;padding:0 14px;height:54px;transition:.2s}
.lfield:focus-within{border-color:var(--blue2);box-shadow:0 0 0 4px rgba(61,139,255,.2)}
.lfield input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:18px;font-weight:700;letter-spacing:2px;text-align:right}
.lfield input::placeholder{color:#8794A6;font-size:14px;font-weight:500;letter-spacing:0}
.lfield svg{color:#8794A6}
.btn-login{margin-top:12px;width:100%;height:54px;border-radius:14px;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(90deg,#1F6FFF,#4FA3FF);box-shadow:0 10px 30px rgba(31,111,255,.45);transition:.2s}
.btn-login:active{transform:scale(.98)}
.login-phones{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;position:relative}
.login-phones a{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;text-decoration:none;color:#DDE4EC;font-weight:700;font-size:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(201,210,220,.18)}
.login-phones a svg{width:18px;height:18px;color:#25D366}
.install-btn{margin-top:14px;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;color:#fff;font-weight:700;position:relative;
  background:rgba(47,123,255,.18);border:1px solid rgba(79,163,255,.45)}
.install-btn svg{width:18px;height:18px}
.login-foot{margin-top:14px;color:#6E7B8D;font-size:11px;letter-spacing:2px;position:relative}
.brand-ic{width:42px;height:42px;border-radius:12px;object-fit:cover;box-shadow:0 0 0 1px rgba(201,210,220,.25),0 6px 16px rgba(0,0,0,.35);flex-shrink:0}
.sb-brand .bt{min-width:0;line-height:1.25}
.sb-brand .bt b{display:block;font-size:15.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-brand .bt small{color:#8E9AAB;font-size:11px;letter-spacing:.3px}

/* ---------- Layout ---------- */
#app{min-height:100vh}
.sidebar{position:fixed;top:0;right:0;bottom:0;width:var(--sbw);background:linear-gradient(180deg,#1C232E,#11161E);color:#C9D6F0;display:flex;flex-direction:column;z-index:40;transition:transform .25s}
.sb-brand{padding:22px 20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-nav{flex:1;overflow-y:auto;padding:14px 12px}
.sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#B7C5E3;font-weight:600;cursor:pointer;margin-bottom:3px;transition:.15s;text-decoration:none}
.sb-nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.sb-nav a.on{background:linear-gradient(90deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 8px 20px rgba(31,111,255,.35)}
.sb-sep{height:1px;background:rgba(255,255,255,.07);margin:10px 8px}
.sb-user{padding:14px;margin:12px;border-radius:14px;background:rgba(255,255,255,.05);display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.sb-user .who{flex:1;min-width:0}
.sb-user .who b{display:block;color:#fff;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .who small{color:#8EA3C9;font-size:11.5px}
.sb-user button{color:#8EA3C9;padding:6px;border-radius:8px}
.sb-user button:hover{color:#fff;background:rgba(255,255,255,.08)}
.main{margin-right:var(--sbw);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(238,243,250,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 26px;display:flex;align-items:center;gap:14px}
.topbar .menu-btn{display:none}
.tsearch{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px;height:46px;box-shadow:var(--sh)}
.tsearch{min-width:0}
.tsearch input{flex:1;border:0;outline:0;background:none;min-width:0;width:100%}
.tsearch svg{color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text);box-shadow:var(--sh);flex-shrink:0}
.icon-btn:hover{color:var(--blue)}
.tuser{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
.tuser .who{text-align:left;line-height:1.3}
.tuser .who b{display:block;font-size:13.5px}
.tuser .who small{color:var(--muted);font-size:11.5px}
#view{padding:8px 26px 40px;flex:1}
.bnav{display:none}
.scrim{position:fixed;inset:0;background:rgba(5,12,31,.45);z-index:35;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}

/* ---------- Common ---------- */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 18px;flex-wrap:wrap}
.page-head h2{font-size:22px;font-weight:800}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;border:1px solid rgba(227,233,244,.6)}
.card h3{font-size:15.5px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 a{font-size:12.5px;color:var(--blue);font-weight:700;cursor:pointer}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:18px}
.grid2.eq{grid-template-columns:1fr 1fr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;font-weight:700;transition:.15s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-p{background:linear-gradient(90deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 8px 20px rgba(31,111,255,.3)}
.btn-p:active{transform:scale(.98)}
.btn-g{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn-g:hover{border-color:var(--blue);color:var(--blue)}
.btn-soft{background:var(--blue-soft);color:var(--blue)}
.btn-red{background:var(--red-soft);color:var(--red)}
.btn-green{background:var(--green);color:#fff}
.btn-lg{height:52px;font-size:15.5px;border-radius:14px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;outline:0;width:100%;transition:.15s}
textarea.inp{height:auto;min-height:70px;padding:10px 14px;resize:vertical}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,111,255,.12)}
.inp:disabled{background:#F5F7FB;color:var(--muted)}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-green{background:var(--green-soft);color:#067647}
.p-orange{background:var(--orange-soft);color:#B54708}
.p-red{background:var(--red-soft);color:#B42318}
.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-purple{background:var(--purple-soft);color:var(--purple)}
.p-gray{background:#F0F3F8;color:var(--muted)}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty svg{width:44px;height:44px;opacity:.4;margin-bottom:8px}
.seg{display:flex;background:#F0F4FA;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(16,40,90,.1)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:700;color:var(--muted);font-size:13px}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .inp{height:42px;width:auto;flex:1;min-width:140px}
.toolbar select.inp{flex:0 1 190px}

/* ---------- Table ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFE}
.tbl td{padding:12px;border-bottom:1px solid #EEF2F8;vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#F7FAFF}
.tbl .acts{display:flex;gap:6px;justify-content:flex-end}
.mini-btn{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:#F3F6FB;color:var(--muted)}
.mini-btn:hover{background:var(--blue-soft);color:var(--blue)}
.mini-btn svg{width:17px;height:17px}

/* ---------- Dashboard ---------- */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:30px 30px;margin-bottom:18px;color:#fff;min-height:150px;
  background:radial-gradient(420px 220px at 18% 50%,rgba(47,123,255,.38),transparent 70%),linear-gradient(110deg,#1A2029,#232C38 55%,#2B3644)}
.hero .hero-logo{position:absolute;left:8px;top:50%;transform:translateY(-50%);height:150%;max-height:240px;width:auto;opacity:.95;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 100%)}
.hero h1{font-size:25px;font-weight:800;position:relative}
.hero p{color:#BFD0F2;position:relative}
.hero .date{display:inline-block;margin-top:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);padding:4px 12px;border-radius:999px;font-size:12.5px;position:relative}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.kpi{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kpi .k-lbl{color:var(--muted);font-size:13px;font-weight:700}
.kpi .k-val{font-size:26px;font-weight:800;line-height:1.3;margin-top:4px}
.kpi .k-val small{font-size:13px;color:var(--muted);font-weight:700;margin-inline-start:4px}
.kpi .k-delta{font-size:12px;font-weight:700;margin-top:4px}
.k-ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.k-ico svg{width:24px;height:24px}
.ki-green{background:linear-gradient(135deg,#12B76A,#32D583);box-shadow:0 8px 18px rgba(18,183,106,.3)}
.ki-blue{background:linear-gradient(135deg,#1F6FFF,#53A1FF);box-shadow:0 8px 18px rgba(31,111,255,.3)}
.ki-orange{background:linear-gradient(135deg,#F79009,#FDB022);box-shadow:0 8px 18px rgba(247,144,9,.3)}
.ki-purple{background:linear-gradient(135deg,#7A5AF8,#9B8AFB);box-shadow:0 8px 18px rgba(122,90,248,.3)}
.up{color:var(--green)} .down{color:var(--red)}
.chart-box{position:relative;height:260px}
.top-list .ti{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F0F3F8}
.top-list .ti:last-child{border-bottom:0}
.rank{width:26px;height:26px;border-radius:8px;background:var(--orange-soft);color:var(--orange);font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ti .nm{flex:1;min-width:0}
.ti .nm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .nm small{color:var(--muted);font-size:12px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.qa button{background:linear-gradient(135deg,var(--navy2),var(--navy3));color:#fff;border-radius:14px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13px;transition:.15s}
.qa button:nth-child(2){background:linear-gradient(135deg,var(--blue),var(--blue2))}
.qa button:active{transform:scale(.97)}
.qa svg{width:26px;height:26px}

/* ---------- Search / categories ---------- */
.big-search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 6px;box-shadow:var(--sh);margin-bottom:18px}
.big-search:focus-within{border-color:var(--blue)}
.big-search>svg{margin-inline-start:10px;color:var(--muted)}
.big-search input{flex:1;border:0;outline:0;height:44px;font-size:15px;background:none;min-width:0}
.big-search .scan-b{width:46px;height:46px;border-radius:12px;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px;font-weight:700}
.crumbs a{color:var(--blue);cursor:pointer}
.crumbs span{color:var(--muted)}
.crumbs svg{width:16px;height:16px;color:var(--muted)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cat-tile{background:#fff;border-radius:16px;padding:18px 12px;text-align:center;box-shadow:var(--sh);border:1px solid rgba(227,233,244,.7);cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:10px}
.cat-tile:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.cat-tile .ct-ico{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.cat-tile .ct-ico svg{width:28px;height:28px}
.cat-tile b{font-size:13.5px;line-height:1.45}
.cat-tile small{color:var(--muted);font-size:12px}
.item-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.item-card{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;cursor:pointer;border:1px solid rgba(227,233,244,.7);transition:.15s}
.item-card:hover{border-color:var(--blue2)}
.thumb{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:26px;height:26px}
.item-card .ic-body{flex:1;min-width:0}
.item-card .ic-body b{display:block;font-size:14px;line-height:1.45}
.item-card .ic-body small{color:var(--muted);font-size:12px}
.price-tag{text-align:left;flex-shrink:0}
.price-tag b{display:block;font-size:18px;color:var(--blue);font-weight:800;line-height:1.2}
.price-tag small{color:var(--muted);font-size:11.5px}
.pending-bar{background:var(--orange-soft);color:#93370D;border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-weight:700}
.pending-bar button{margin-inline-start:auto;color:#93370D}

/* ---------- Invoice builder ---------- */
.inv-grid{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
.add-box{position:relative;margin-bottom:14px}
.dd{position:absolute;top:calc(100% + 6px);right:0;left:0;background:#fff;border-radius:14px;box-shadow:var(--sh2);z-index:20;max-height:330px;overflow-y:auto;border:1px solid var(--line)}
.dd .dd-i{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid #F2F5FA}
.dd .dd-i:hover{background:#F6F9FF}
.dd .dd-i b{flex:1;font-size:13.5px}
.cart-line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #EEF2F8}
.cart-line .cl-name{flex:1;min-width:0}
.cart-line .cl-name b{display:block;font-size:13.5px;line-height:1.45}
.cart-line .cl-name small{color:var(--muted);font-size:12px}
.stepper{display:flex;align-items:center;background:#F3F6FB;border-radius:10px}
.stepper button{width:32px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.stepper button svg{width:16px;height:16px}
.stepper input{width:42px;text-align:center;border:0;background:none;font-weight:800;outline:0}
.cl-price{width:80px;height:36px;border:1px solid var(--line);border-radius:10px;text-align:center;font-weight:700;outline:0}
.cl-price:disabled{background:none;border-color:transparent}
.cl-total{width:86px;text-align:left;font-weight:800}
.sum-row{display:flex;justify-content:space-between;padding:6px 0;font-weight:700}
.sum-row.big{font-size:20px;font-weight:800;border-top:1px dashed var(--line);margin-top:6px;padding-top:12px}
.sum-row.big span:last-child{color:var(--blue)}
.sticky{position:sticky;top:84px}

/* ---------- Invoice paper ---------- */
.paper-wrap{background:#E9EEF6;border-radius:14px;padding:16px;max-height:62vh;overflow:auto}
#invoicePaper{background:#fff;width:100%;max-width:560px;margin:0 auto;padding:26px 24px;color:#0E1A33;font-size:13px;position:relative}
.ip-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1A212C;padding-bottom:14px;margin-bottom:14px}
.ip-brand{display:flex;gap:10px;align-items:center}
.ip-brand img{width:58px;height:58px;border-radius:12px;object-fit:cover}
.ip-head .ip-brand b{display:block;font-size:19px;font-weight:800;color:#11161E;line-height:1.3}
.ip-head .ip-brand div{color:#5B6B8C;font-size:12px}
.ip-no{text-align:left}
.ip-no b{display:block;font-size:15px;color:var(--blue)}
.ip-no small{color:#5B6B8C}
.ip-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:14px;font-size:12.5px}
.ip-meta span{color:#5B6B8C}
.ip-tbl{width:100%;border-collapse:collapse;margin-bottom:12px}
.ip-tbl th{background:#1A212C;color:#fff;padding:7px 8px;font-size:12px;text-align:right}
.ip-tbl td{padding:7px 8px;border-bottom:1px solid #E6EBF3;font-size:12.5px}
.ip-tbl td.n,.ip-tbl th.n{text-align:center}
.ip-tot{margin-inline-start:auto;width:60%;min-width:220px}
.ip-tot div{display:flex;justify-content:space-between;padding:4px 0}
.ip-tot .net{font-size:16px;font-weight:800;border-top:2px solid #1A212C;margin-top:4px;padding-top:8px}
.ip-foot{text-align:center;color:#5B6B8C;margin-top:18px;font-size:12px;border-top:1px dashed #CBD5E4;padding-top:10px}
.stamp{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);font-size:54px;font-weight:800;color:rgba(240,68,56,.18);border:5px solid rgba(240,68,56,.18);padding:0 24px;border-radius:14px;pointer-events:none}
.inv-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.inv-actions .btn{flex:1;min-width:120px}

/* ---------- Modal / toast / loader ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(5,12,31,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .15s}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s}
.modal.wide{max-width:760px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;position:sticky;top:0;background:#fff;z-index:2}
.mh h3{font-size:17px;font-weight:800}
.mb{padding:6px 20px 20px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--navy2);color:#fff;padding:11px 18px;border-radius:12px;box-shadow:var(--sh2);font-weight:700;display:flex;align-items:center;gap:8px;animation:pop .2s;max-width:90vw}
.toast.ok{background:#067647} .toast.err{background:#B42318}
.loader{position:fixed;inset:0;z-index:110;display:flex;align-items:center;justify-content:center;background:rgba(238,243,250,.45)}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid rgba(31,111,255,.2);border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:120px;border-radius:16px;background:linear-gradient(90deg,#E6ECF5,#F2F5FA,#E6ECF5);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* item detail */
.det-top{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.det-top .thumb{width:72px;height:72px;border-radius:18px}
.det-top b{font-size:17px;line-height:1.45;display:block}
.det-prices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.det-prices div{border-radius:14px;padding:14px;text-align:center}
.det-prices div:first-child{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.det-prices div:last-child{background:#F3F6FB}
.det-prices small{display:block;font-weight:700;opacity:.85;font-size:12px}
.det-prices b{font-size:26px;font-weight:800}
.det-info{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px;margin-bottom:16px}
.det-info span{color:var(--muted)}
.det-img{display:block;width:100%;max-height:280px;object-fit:contain;border-radius:16px;background:#F3F6FB;margin-bottom:14px}
.img-pick{display:flex;gap:12px;align-items:center}
.img-prev{width:96px;height:96px;border-radius:16px;background:#F3F6FB;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--muted)}
.img-prev img{width:100%;height:100%;object-fit:cover}
.img-prev svg{width:30px;height:30px}
.img-btns{display:flex;flex-direction:column;gap:8px;flex:1}
.note-box{background:var(--orange-soft);color:#93370D;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}

/* scanner */
#reader{width:100%;min-height:240px;border-radius:14px;overflow:hidden;background:#0A1430}
#reader video{border-radius:14px}
.cam-off{color:#9FB4DA;text-align:center;padding:50px 20px}
.cam-off svg{width:40px;height:40px;margin-bottom:8px}

/* roles matrix */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:right}
.matrix input{width:20px;height:20px;accent-color:var(--blue)}
.bar{height:8px;border-radius:99px;background:#EEF2F8;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue2))}
.sub-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sub-chip{display:inline-flex;align-items:center;gap:6px;background:#F3F6FB;border-radius:10px;padding:5px 6px 5px 10px;font-size:12.5px;font-weight:700}
.sub-chip small{color:var(--muted);font-weight:600}
.sub-chip button{color:var(--muted);display:flex}
.sub-chip button svg{width:14px;height:14px}

/* ---------- Responsive ---------- */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,1fr)}.inv-grid{grid-template-columns:1fr 320px}}
@media (max-width:960px){
  .sidebar{transform:translateX(105%)}
  .sidebar.open{transform:none}
  .main{margin-right:0;padding-bottom:84px}
  .topbar{padding:12px 14px}
  .topbar .menu-btn{display:flex}
  .tuser{display:none}
  .topbar{gap:8px}
  .topbar .icon-btn{width:42px;height:42px}
  .tsearch{height:44px;padding:0 12px}
  #view{padding:4px 14px 30px}
  .grid2,.grid2.eq,.inv-grid{grid-template-columns:1fr}
  .sticky{position:static}
  .qa{grid-template-columns:repeat(2,1fr)}
  .hero{padding:22px 20px}
  .hero h1{font-size:21px}
  .hero .hero-logo{opacity:.3;left:-20px}
  .bnav{display:flex;position:fixed;bottom:0;right:0;left:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -6px 20px rgba(16,40,90,.06)}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
  .bnav button.on{color:var(--blue)}
  .bnav .fab{flex:0 0 auto;width:58px;height:58px;border-radius:18px;margin-top:-26px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 10px 24px rgba(31,111,255,.45);justify-content:center}
  .bnav .fab svg{width:26px;height:26px}
  .tbl.cards thead{display:none}
  .tbl.cards tr{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:10px 12px}
  .tbl.cards td{display:flex;justify-content:space-between;gap:10px;border:0;padding:5px 0}
  .tbl.cards td::before{content:attr(data-l);color:var(--muted);font-size:12px;font-weight:700}
  .tbl.cards td.nolbl::before{display:none}
  .tbl.cards tr.click:hover td{background:none}
  .item-list{grid-template-columns:1fr}
  .modal-bg{align-items:flex-end;padding:0}
  .modal,.modal.wide{max-width:none;border-radius:22px 22px 0 0;max-height:94vh}
  .paper-wrap{max-height:none;padding:8px}
  #invoicePaper{padding:18px 14px}
}
@media (max-width:420px){.kpi .k-val{font-size:21px}.kpis{gap:10px}.kpis .card{padding:14px}.k-ico{width:40px;height:40px}}

@media print{
  @page{margin:8mm}
  body{background:#fff}
  body *{visibility:hidden}
  #invoicePaper,#invoicePaper *{visibility:visible}
  #invoicePaper{position:absolute;inset:0 0 auto 0;max-width:none;box-shadow:none}
  .modal-bg{position:static;background:none}
}
</style>

<body>

<!-- ================= Login ================= -->
<div id="login" class="hidden">
  <div class="login-hero"><img id="loginLogo" alt=""></div>
  <div class="login-card">
    <h1>أهلاً بيك في نظام إدارة المعرض</h1>
    <p class="sub">سجّل دخولك برقم اليوزر</p>
    <form onsubmit="doLogin(event)">
      <div class="lfield">
        <span data-ic="user"></span>
        <input id="loginNo" inputmode="numeric" autocomplete="off" placeholder="رقم اليوزر">
      </div>
      <button class="btn-login" type="submit">دخول <span data-ic="arrowL"></span></button>
    </form>
  </div>
  <div class="login-phones" id="loginPhones"></div>
  <button class="install-btn hidden" data-install onclick="installApp()"><span data-ic="download"></span>تثبيت التطبيق على الموبايل</button>
  <div class="login-foot">M&amp;S CAR ACCESSORIES</div>
</div>

<!-- ================= App ================= -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand" id="sbBrand"></div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-user">
      <div class="avatar" id="sbAv"></div>
      <div class="who"><b id="sbName"></b><small id="sbRole"></small></div>
      <button onclick="doLogout()" title="تسجيل الخروج"><span data-ic="logout"></span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim" onclick="toggleSb(false)"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" onclick="toggleSb(true)"><span data-ic="menu"></span></button>
      <div class="tsearch">
        <span data-ic="search"></span>
        <input id="topQ" placeholder="ابحث عن صنف بالاسم أو الكود أو الباركود..." onkeydown="topSearch(event)">
      </div>
      <button class="icon-btn" onclick="openScanner('search')" title="مسح باركود"><span data-ic="scan"></span></button>
      <button class="icon-btn" onclick="refreshData()" title="تحديث البيانات"><span data-ic="refresh"></span></button>
      <div class="tuser">
        <div class="who"><b id="tbName"></b><small id="tbRole"></small></div>
        <div class="avatar" id="tbAv"></div>
      </div>
    </header>
    <main id="view"></main>
  </div>
  <nav class="bnav" id="bnav"></nav>
</div>

<div class="toasts" id="toasts"></div>
<div class="loader hidden" id="loader"><div class="spin"></div></div>
<div id="modalRoot"></div>
<div id="reader-file" class="hidden"></div>

function callFail(e,rej){
  const m=String((e&&e.message)||e).replace(/^Error:\s*/,'');
  if(m.indexOf('SESSION')>-1&&S.token){toast('انتهت الجلسة، ادخل تاني','err');doLogout(true);}
  rej(new Error(m));
}
function call(fn,...a){
  if(IS_WEB){
    return new Promise((res,rej)=>{
      if(/PASTE/.test(API_URL)){rej(new Error('لازم تحط رابط السكريبت في ملف config.js'));return;}
      fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a})})
        .then(r=>r.json())
        .then(j=>{if(j&&j.ok)res(j.data);else callFail(new Error((j&&j.error)||'حصلت مشكلة'),rej);})
        .catch(()=>callFail(new Error(navigator.onLine===false?'مفيش إنترنت':'مش قادر أوصل للسيرفر، جرّب تاني'),rej));
    });
  }
  return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(res).withFailureHandler(e=>callFail(e,rej))[fn](...a);
  });
}
async function run(fn,...a){
  loading(true);
  try{return await call(fn,...a);}
  catch(e){if(e.message.indexOf('SESSION')<0)toast(e.message,'err');return undefined;}
  finally{loading(false);}
}
let loadN=0;
function loading(on){loadN+=on?1:-1;if(loadN<0)loadN=0;$('#loader').classList.toggle('hidden',loadN===0);}
function toast(msg,type){
  const t=document.createElement('div');t.className='toast '+(type||'');
  t.innerHTML=ic(type==='err'?'x':'check')+'<span>'+esc(msg)+'</span>';
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200);
}
function brandHtml(){
  const n=S.set.name||(window.SHOP&&SHOP.name)||'';
  return (window.LOGO_ICON?'<img class="brand-ic" src="'+LOGO_ICON+'" alt="">':'')+'<div class="bt"><b>'+esc(n)+'</b><small>M&amp;S Car Accessories</small></div>';
}
function phoneList(p){return (String(p||'').match(/0\d{10}/g)||[]);}
function renderLoginShop(){
  const sh=window.SHOP||{};
  if(window.LOGO_MAIN)$('#loginLogo').src=LOGO_MAIN;
  if(sh.name)document.title=sh.name;
  $('#loginPhones').innerHTML=phoneList(sh.phone).map(n=>'<a href="https://wa.me/2'+n+'" target="_blank" rel="noopener">'+ic('msg')+'<span class="num">'+n+'</span></a>').join('');
}
function catIdx(name){const i=S.cats.findIndex(c=>c.name===name);return i<0?S.cats.length:i;}
function catIcon(name){return CAT_ICONS[catIdx(name)%CAT_ICONS.length];}
function catColor(name){return CAT_COLORS[catIdx(name)%CAT_COLORS.length];}
function thumb(it,size){
  const c=catColor(it.cat);
  if(it.image&&/^https?:\/\//.test(it.image))return '<div class="thumb" style="background:'+c+'14"><img src="'+esc(it.image)+'" onerror="this.remove()"></div>';
  return '<div class="thumb" style="background:'+c+'14;color:'+c+'">'+ic(catIcon(it.cat))+'</div>';
}
function statusPill(s){
  const m={'مدفوعة':'p-green','آجلة':'p-orange','ملغية':'p-red','فعال':'p-green','موقوف':'p-red'};
  return '<span class="pill '+(m[s]||'p-gray')+'">'+esc(s||'-')+'</span>';
}
function norm(s){return String(s||'').toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[×*]/g,'x').replace(/\s+/g,' ').trim();}
function hay(it){return it._h||(it._h=norm(it.name+' '+it.code+' '+it.barcode+' '+it.sub+' '+it.cat));}
function searchItems(q,list){
  const t=norm(q).split(' ').filter(Boolean);if(!t.length)return [];
  return (list||S.items).filter(it=>{const h=hay(it),h2=h.replace(/ /g,'');return t.every(w=>h.includes(w)||h2.includes(w));});
}
function exactFind(q){q=String(q||'').trim();if(!q)return null;return S.items.find(i=>i.barcode&&i.barcode===q)||S.items.find(i=>i.code.toLowerCase()===q.toLowerCase())||null;}
function activeItems(){return S.items.filter(i=>i.status!=='موقوف');}
function priceOf(it,type){return Number(type==='جملة'?it.wholesale:it.retail)||0;}

async function boot(){
  hydrateIcons();
  renderLoginShop();
  if(IS_WEB){
    call('shopInfo').then(sh=>{window.SHOP=sh;lsSet('ap_shop',JSON.stringify(sh));renderLoginShop();}).catch(()=>{});
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  const tok=lsGet('ap_token');
  if(tok){
    loading(true);
    try{const d=await call('resume',tok);S.token=tok;onData(d);}
    catch(e){lsSet('ap_token',null);showLogin();}
    finally{loading(false);}
  }else showLogin();
}
function showLogin(){
  $('#app').classList.add('hidden');$('#login').classList.remove('hidden');
  const last=lsGet('ap_last');if(last)$('#loginNo').value=last;
  setTimeout(()=>$('#loginNo').focus(),100);
}
async function doLogin(e){
  e.preventDefault();
  const no=$('#loginNo').value.trim();
  if(!no){toast('اكتب رقم اليوزر','err');return;}
  const r=await run('login',no);
  if(!r)return;
  S.token=r.token;lsSet('ap_token',r.token);lsSet('ap_last',no);
  onData(r.data);
  toast('أهلاً '+r.data.user.name,'ok');
}
function doLogout(silent){
  if(S.token&&!silent)call('logout',S.token).catch(()=>{});
  S.token=null;S.user=null;lsSet('ap_token',null);
  closeModal();showLogin();
}
function onData(d){
  S.user=d.user;S.set=d.settings;S.cats=d.cats;S.subs=d.subs;S.items=d.items;S.users=d.users;
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  window.SHOP={name:S.set.name,phone:S.set.phone};renderLoginShop();
  $('#sbBrand').innerHTML=brandHtml(false);
  const ini=(S.user.name||'?').trim().charAt(0);
  ['#sbAv','#tbAv'].forEach(s=>$(s).textContent=ini);
  $('#sbName').textContent=$('#tbName').textContent=S.user.name;
  $('#sbRole').textContent=$('#tbRole').textContent=S.user.role;
  document.title=S.set.name;
  buildNav();
  go(S.route||'home',S.params||{});
}
async function refreshData(){
  const d=await run('resume',S.token);
  if(d){onData(d);toast('اتحدثت البيانات','ok');}
}

function buildNav(){
  let h='';
  NAV.forEach(n=>{
    if(n.sep){h+='<div class="sb-sep"></div>';return;}
    if(n.ok&&!n.ok())return;
    h+='<a data-nav="'+n.id+'" onclick="navClick(\''+n.id+'\')">'+ic(n.icon)+'<span>'+n.label+'</span></a>';
  });
  h+='<a class="hidden" data-install onclick="installApp()">'+ic('download')+'<span>تثبيت التطبيق</span></a>';
  $('#sbNav').innerHTML=h;
  showInstall();
  const b=[['home','الرئيسية','home'],['search','بحث','search']];
  let bh=b.map(x=>'<button data-bn="'+x[0]+'" onclick="go(\''+x[0]+'\')">'+ic(x[2])+x[1]+'</button>').join('');
  bh+=P('createInv')?'<button class="fab" onclick="go(\'newInv\')">'+ic('plus')+'</button>':'<button onclick="openScanner(\'search\')">'+ic('scan')+'باركود</button>';
  bh+='<button data-bn="invoices" onclick="go(\'invoices\')">'+ic('receipt')+'الفواتير</button>';
  bh+='<button onclick="toggleSb(true)">'+ic('menu')+'المزيد</button>';
  $('#bnav').innerHTML=bh;
}
function navClick(id){
  const n=NAV.find(x=>x.id===id);
  toggleSb(false);
  if(n&&n.act){n.act();return;}
  go(id);
}
function toggleSb(on){$('#sidebar').classList.toggle('open',on);$('#scrim').classList.toggle('on',on);}
function go(route,params){
  S.route=route;S.params=params||{};
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===route));
  document.querySelectorAll('[data-bn]').forEach(a=>a.classList.toggle('on',a.dataset.bn===route));
  S.charts.forEach(c=>{try{c.destroy()}catch(e){}});S.charts=[];
  const f=PAGES[route]||PAGES.home;
  $('#view').innerHTML='';
  f();
  window.scrollTo(0,0);
}
function topSearch(e){
  if(e.key!=='Enter')return;
  const q=e.target.value.trim();
  const it=exactFind(q);
  if(it){openItem(it.code);e.target.value='';return;}
  go('search',{q});e.target.value='';
}

function kpi(lbl,val,unit,delta,icon,cls){
  return '<div class="card kpi"><div><div class="k-lbl">'+lbl+'</div><div class="k-val"><span class="num">'+val+'</span>'+(unit?'<small>'+unit+'</small>':'')+'</div><div class="k-delta">'+delta+'</div></div><div class="k-ico '+cls+'">'+ic(icon)+'</div></div>';
}
function lineChart(id,labels,data){
  if(!window.Chart)return;
  const ctx=document.getElementById(id);if(!ctx)return;
  const g=ctx.getContext('2d').createLinearGradient(0,0,0,260);g.addColorStop(0,'rgba(31,111,255,.28)');g.addColorStop(1,'rgba(31,111,255,0)');
  S.charts.push(new Chart(ctx,{type:'line',data:{labels,datasets:[{data,borderColor:'#1F6FFF',backgroundColor:g,fill:true,tension:.4,borderWidth:3,pointRadius:4,pointBackgroundColor:'#fff',pointBorderColor:'#1F6FFF',pointBorderWidth:2}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{rtl:true,callbacks:{label:c=>fm(c.raw)+' '+(S.set.currency||'')}}},scales:{x:{grid:{display:false},ticks:{font:{family:'Cairo'}}},y:{beginAtZero:true,grid:{color:'#EEF2F8'},ticks:{font:{family:'Cairo'},callback:v=>v>=1000?(v/1000)+'K':v}}}}}));
}

function renderSearch(){
  const q=($('#sq')||{}).value||'';
  const p=S.params;
  const box=$('#sres');if(!box)return;
  const list=canManageItems()?S.items:activeItems();
  if(q.trim()){
    const r=searchItems(q,list);
    box.innerHTML='<div class="muted" style="margin-bottom:10px;font-weight:700">'+r.length+' نتيجة</div>'+itemCards(r.slice(0,120));
    return;
  }
  if(!p.cat){
    box.innerHTML='<div class="cat-grid">'+S.cats.map(c=>{const n=list.filter(i=>i.cat===c.name).length;const col=catColor(c.name);
      return '<div class="cat-tile" onclick="go(\'search\',{cat:\''+esc(c.name)+'\'})"><div class="ct-ico" style="background:'+col+'14;color:'+col+'">'+ic(catIcon(c.name))+'</div><b>'+esc(c.name)+'</b><small>'+n+' صنف</small></div>';}).join('')+'</div>';
    return;
  }
  const crumbs='<div class="crumbs"><a onclick="go(\'search\')">كل الأقسام</a>'+ic('chevL')+(p.sub?'<a onclick="go(\'search\',{cat:\''+esc(p.cat)+'\'})">'+esc(p.cat)+'</a>'+ic('chevL')+'<span>'+esc(p.sub)+'</span>':'<span>'+esc(p.cat)+'</span>')+'</div>';
  if(!p.sub){
    const subs=S.subs.filter(s=>s.cat===p.cat);const col=catColor(p.cat);
    box.innerHTML=crumbs+'<div class="cat-grid">'+subs.map(s=>{const n=list.filter(i=>i.cat===p.cat&&i.sub===s.name).length;
      return '<div class="cat-tile" onclick="go(\'search\',{cat:\''+esc(p.cat)+'\',sub:\''+esc(s.name)+'\'})"><div class="ct-ico" style="background:'+col+'14;color:'+col+'">'+ic(catIcon(p.cat))+'</div><b>'+esc(s.name)+'</b><small>'+n+' صنف</small></div>';}).join('')+'</div>';
    return;
  }
  const items=list.filter(i=>i.cat===p.cat&&i.sub===p.sub);
  box.innerHTML=crumbs+(items.length?itemCards(items):'<div class="empty">'+ic('box')+'<div>مفيش أصناف هنا</div></div>');
}

async function toggleItem(code){
  const it=S.items.find(i=>i.code===code);
  const st=it.status==='موقوف'?'فعال':'موقوف';
  if(st==='موقوف'&&!(await confirmBox('توقف الصنف "'+it.name+'"؟ مش هيظهر للبائعين.')))return;
  const r=await run('setItemStatus',S.token,code,st);
  if(r){replaceItem(r);toast('اتعدلت الحالة','ok');closeModal();rerender();}
}
async function linkBarcode(code){
  const it=S.items.find(i=>i.code===code);
  const r=await run('saveItem',S.token,Object.assign({},it,{barcode:S.pendingBarcode,onlyBarcode:true}));
  if(r){replaceItem(r);S.pendingBarcode=null;toast('اتربط الباركود بـ '+r.name,'ok');closeModal();go('search',{});}

function renderImgPrev(){
  const b=$('#f_prev');if(!b)return;const im=S._img||{};
  const src=im.data||im.url;
  b.innerHTML=src?'<img src="'+esc(src)+'">':ic('camera');
  $('#f_imgDel').classList.toggle('hidden',!src);
}
function resizeImg(file,max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{
      let w=im.width,h=im.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',.82));
    };im.onerror=rej;im.src=fr.result;};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}
async function pickImg(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  try{S._img.data=await resizeImg(f,900);S._img.removed=false;renderImgPrev();}
  catch(e){toast('معرفتش أفتح الصورة دي','err');}
  inp.value='';
}
function clearImg(){S._img={url:'',data:null,removed:true};renderImgPrev();}
function fillSubs(){
  const c=$('#f_cat').value;const s=$('#f_sub');
  s.innerHTML='<option value="">اختار</option>'+S.subs.filter(x=>x.cat===c).map(x=>'<option'+(x.name===S._formSub?' selected':'')+'>'+esc(x.name)+'</option>').join('');
}
async function saveItemForm(code){
  const im=S._img||{};

  if(im.data)d.imageData=im.data;

  const r=await run('saveItem',S.token,d);

/* ---------------- Invoice builder ---------------- */
function newCart(){return {editNo:null,lines:[],priceType:'قطاعي',customer:'',phone:'',discount:'',paid:'',paidTouched:false,method:'كاش',notes:''};}
function getCart(){
  if(!S.cart){try{S.cart=JSON.parse(lsGet('ap_cart')||'null');}catch(e){S.cart=null;}if(!S.cart)S.cart=newCart();}
  return S.cart;
}
function saveCart(){lsSet('ap_cart',JSON.stringify(S.cart));}
function addToCart(code,qty){
  const c=getCart();const it=S.items.find(i=>i.code===code);if(!it)return;
  const l=c.lines.find(x=>x.code===code);
  if(l)l.qty+=qty||1;else c.lines.push({code,name:it.name,qty:qty||1,price:priceOf(it,c.priceType)});
  saveCart();
}

  '<div class="row"><div class="field"><label>الخصم</label><input class="inp num" type="number" step="any" inputmode="decimal" id="c_discount" value="'+esc(c.discount)+'" oninput="cartSet(\'discount\',this.value)"></div>'+

function cartSet(k,v,touched){const c=getCart();c[k]=v;if(touched)c.paidTouched=v!=='';saveCart();renderSum();}
function setPriceType(t){
  const c=getCart();c.priceType=t;
  c.lines.forEach(l=>{const it=S.items.find(i=>i.code===l.code);if(it)l.price=priceOf(it,t);});
  saveCart();document.querySelectorAll('#ptSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===t));renderCart();
}
function invDD(){
  const q=$('#aq').value;const dd=$('#dd');
  if(!q.trim()){dd.classList.add('hidden');return;}
  const r=searchItems(q,activeItems()).slice(0,8);
  dd.innerHTML=r.length?r.map(it=>'<div class="dd-i" onclick="pickDD(\''+esc(it.code)+'\')">'+thumb(it).replace('class="thumb"','class="thumb" style="width:40px;height:40px;border-radius:10px;background:'+catColor(it.cat)+'14;color:'+catColor(it.cat)+'"')+'<b>'+esc(it.name)+'<div class="muted num" style="font-size:11.5px;font-weight:600">'+esc(it.code)+'</div></b><span class="num" style="font-weight:800;color:var(--blue)">'+fm(priceOf(it,getCart().priceType))+'</span></div>').join(''):'<div class="dd-i muted">مفيش نتايج</div>';
  dd.classList.remove('hidden');
}
function pickDD(code){addToCart(code);$('#aq').value='';$('#dd').classList.add('hidden');renderCart();$('#aq').focus();}
function invKey(e){
  if(e.key!=='Enter')return;
  e.preventDefault();
  const q=$('#aq').value.trim();if(!q)return;
  const it=exactFind(q)||searchItems(q,activeItems())[0];
  if(it)pickDD(it.code);else toast('الصنف مش موجود','err');
}
function renderCart(){
  const c=getCart();const box=$('#cartBox');if(!box)return;
  const canP=P('editPrice');
  box.innerHTML=c.lines.length?c.lines.map((l,i)=>{const it=S.items.find(x=>x.code===l.code)||{cat:''};
   return '<div class="cart-line">'+thumb(it)+'<div class="cl-name"><b>'+esc(l.name)+'</b><small class="num">'+esc(l.code)+'</small></div>'+
   '<div class="stepper"><button onclick="qtyStep('+i+',1)">'+ic('plus')+'</button><input class="num" value="'+l.qty+'" inputmode="decimal" onchange="qtySet('+i+',this.value)"><button onclick="qtyStep('+i+',-1)">'+ic('minus')+'</button></div>'+
   '<input class="cl-price num" type="number" step="any" value="'+l.price+'" '+(canP?'onchange="priceSet('+i+',this.value)"':'disabled')+'>'+
   '<div class="cl-total num">'+fm(l.qty*l.price)+'</div><button class="mini-btn" onclick="rmLine('+i+')">'+ic('trash')+'</button></div>';}).join(''):
   '<div class="empty">'+ic('receipt')+'<div>ابحث عن صنف أو امسح الباركود عشان تضيفه</div></div>';
  renderSum();
}
function cartTotals(){
  const c=getCart();
  const total=c.lines.reduce((s,l)=>s+l.qty*l.price,0);
  const disc=Math.min(Math.max(Number(c.discount)||0,0),total);
  const net=total-disc;
  const paid=c.paidTouched?Math.min(Math.max(Number(c.paid)||0,0),net):net;
  return {total,disc,net,paid,rem:net-paid,change:c.paidTouched?Math.max((Number(c.paid)||0)-net,0):0};
}
function renderSum(){
  const box=$('#sumBox');if(!box)return;const t=cartTotals();
  box.innerHTML='<div class="sum-row"><span>الإجمالي ('+getCart().lines.length+' صنف)</span><span class="num">'+fm(t.total)+'</span></div>'+
   (t.disc?'<div class="sum-row"><span>الخصم</span><span class="num down">- '+fm(t.disc)+'</span></div>':'')+
   '<div class="sum-row big"><span>الصافي</span><span class="num">'+fm(t.net)+' '+cur()+'</span></div>'+
   (t.rem>0?'<div class="sum-row"><span>الباقي على العميل</span><span class="num" style="color:var(--orange)">'+fm(t.rem)+'</span></div>':'')+
   (t.change>0?'<div class="sum-row"><span>يرجع للعميل</span><span class="num up">'+fm(t.change)+'</span></div>':'');
}
function qtyStep(i,d){const l=getCart().lines[i];l.qty=Math.max(1,(Number(l.qty)||1)+d);saveCart();renderCart();}
function qtySet(i,v){const n=Number(v);if(n>0){getCart().lines[i].qty=n;saveCart();}renderCart();}
function priceSet(i,v){const n=Number(v);if(n>=0){getCart().lines[i].price=n;saveCart();}renderCart();}
function rmLine(i){getCart().lines.splice(i,1);saveCart();renderCart();}
async function clearCart(){if(getCart().lines.length&&!(await confirmBox('تمسح كل اللي في الفاتورة؟')))return;S.cart=newCart();saveCart();go('newInv');}
async function submitCart(){
  const c=getCart();
  if(!c.lines.length){toast('الفاتورة فاضية','err');return;}
  const t=cartTotals();
  if(t.rem>0&&!c.customer.trim()){toast('اكتب اسم العميل للفاتورة الآجلة','err');$('#c_customer').focus();return;}
  const payload={priceType:c.priceType,customer:c.customer,phone:c.phone,discount:c.discount,paid:c.paidTouched?c.paid:'',method:c.method,notes:c.notes,
    lines:c.lines.map(l=>({code:l.code,qty:l.qty,price:l.price}))};
  const r=c.editNo?await run('updateInvoice',S.token,c.editNo,payload):await run('createInvoice',S.token,payload);
  if(!r)return;
  S.cart=newCart();saveCart();
  toast(c.editNo?'اتعدلت الفاتورة':'اتحفظت الفاتورة '+r.no,'ok');
  go('invoices');
  showInvoice(r);
}

function setInvRange(r){
  const f=S.invF;f.range=r;
  const d=new Date();
  if(r==='today'){f.from=f.to=today();}
  else if(r==='7'){f.from=today(-6);f.to=today();}

}

function showInvoice(inv){
  S.curInv=inv;
  const a=[];
  a.push('<button class="btn btn-p" onclick="invPdf()">'+ic('download')+'PDF</button>');
  a.push('<button class="btn btn-g" onclick="window.print()">'+ic('printer')+'طباعة</button>');
  a.push('<button class="btn btn-green" onclick="invWhats()">'+ic('msg')+'واتساب</button>');
  const b=[];
  if(inv.status!=='ملغية'){
    if(inv.remaining>0&&P('createInv'))b.push('<button class="btn btn-soft" onclick="invPay()">'+ic('wallet')+'تسديد</button>');
    if(P('editInv'))b.push('<button class="btn btn-g" onclick="invEdit()">'+ic('edit')+'تعديل</button>');
    if(P('cancelInv'))b.push('<button class="btn btn-red" onclick="invCancel()">'+ic('x')+'إلغاء الفاتورة</button>');
  }
  modal('<div class="mh"><h3>فاتورة <span class="num">'+esc(inv.no)+'</span> '+statusPill(inv.status)+'</h3><button class="mini-btn" onclick="closeModal()">'+ic('x')+'</button></div><div class="mb">'+
   '<div class="paper-wrap">'+invoicePaperHtml(inv)+'</div>'+
   '<div class="inv-actions">'+a.join('')+'</div>'+(b.length?'<div class="inv-actions">'+b.join('')+'</div>':'')+
   (inv.editedAt&&inv.editedAt!==inv.date?'<div class="muted" style="font-size:12px;margin-top:10px">آخر تعديل: '+esc(inv.editedAt)+' · '+esc(inv.editedByName)+'</div>':'')+'</div>',{wide:true});
}
function invPdf(){
  if(!window.html2pdf){toast('مكتبة الـ PDF مش محملة، استخدم الطباعة','err');return;}
  const el=$('#invoicePaper');
  loading(true);
  html2pdf().set({margin:6,filename:S.curInv.no+'.pdf',image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a5',orientation:'portrait'}})
   .from(el).save().then(()=>{loading(false);toast('اتعمل الـ PDF','ok');}).catch(()=>{loading(false);toast('حصلت مشكلة، استخدم طباعة ← حفظ PDF','err');});
}
function invWhats(){
  const i=S.curInv;
  let ph=(i.phone||'').replace(/\D/g,'');
  if(ph.startsWith('0'))ph='2'+ph;
  const lines=i.lines.map(l=>'• '+l.name+' × '+fm(l.qty)+' = '+fm(l.total)).join('\n');
  const txt=(S.set.name||'')+'\nفاتورة رقم '+i.no+'\n'+i.date+'\n\n'+lines+'\n\nالإجمالي: '+fm(i.total)+(i.discount?'\nالخصم: '+fm(i.discount):'')+'\nالصافي: '+fm(i.net)+' '+(S.set.currency||'')+(i.remaining?'\nالباقي: '+fm(i.remaining):'')+'\n\n'+(S.set.footer||'');
  window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(txt),'_blank');
}
async function invPay(){
  const i=S.curInv;
  const v=await askBox('تسديد على الفاتورة',[{k:'a',label:'المبلغ (الباقي '+fm(i.remaining)+')',type:'number',val:i.remaining}]);

function invEdit(){

  S.cart={editNo:i.no,lines:i.lines.map(l=>({code:l.code,name:l.name,qty:l.qty,price:l.price})),priceType:i.priceType,customer:i.customer,phone:i.phone,discount:i.discount||'',paid:i.remaining>0?i.paid:'',paidTouched:i.remaining>0,method:i.method||'كاش',notes:i.notes};

  for(let ri=0;ri<r.roles.length;ri++){
    const role=r.roles[ri];if(role.role==='أدمن')continue;
    const p={};document.querySelectorAll('input[data-role="'+ri+'"]').forEach(c=>p[c.dataset.k]=c.checked);
    if(Object.keys(p).some(k=>p[k]!==role.perms[k])){last=await run('saveRole',S.token,role.role,p,false);if(!last)return;}
  }
  if(last){renderUsers(last);toast('اتحفظت الصلاحيات','ok');}else toast('مفيش تغيير');
}
async function roleNew(){
  const v=await askBox('صلاحية جديدة',[{k:'n',label:'اسم الصلاحية (مثلاً: كاشير)'}]);
  if(!v)return;
  const r=await run('saveRole',S.token,v.n,{createInv:true},true);
  if(r){renderUsers(r);toast('اتضافت، حدد صلاحياتها من الجدول','ok');}
}

/* ---------------- Log ---------------- */

  const r=await run('getLog',S.token,600);if(r){S.logData=r;renderLog();}
};
function renderLog(){

  const arr=S.logData.filter(l=>!q||norm(Object.values(l).join(' ')).includes(q)).slice(0,300);

  box.innerHTML=arr.length?'<div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>الوقت</th><th>اليوزر</th><th>العملية</th><th>السجل</th><th>الحقل</th><th>من</th><th>إلى</th></tr></thead><tbody>'+
   arr.map(l=>'<tr><td data-l="الوقت" class="num" style="font-size:12px">'+esc(l.date)+'</td><td data-l="اليوزر">'+esc(l.name)+' <span class="muted num">'+esc(l.no)+'</span></td><td data-l="العملية"><span class="pill '+(opCls[l.op]||'p-gray')+'">'+esc(l.op)+'</span></td>'+
    '<td data-l="السجل">'+esc(l.table)+' <b class="num">'+esc(l.id)+'</b></td><td data-l="الحقل">'+esc(l.field||'—')+'</td><td data-l="من" class="muted">'+esc(l.oldV||'—')+'</td><td data-l="إلى"><b>'+esc(l.newV||'—')+'</b></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">مفيش سجلات</div>';
}

/* ---------------- Settings ---------------- */
PAGES.settings=function(){
  if(!P('manageUsers'))return go('home');
  const s=S.set;
  const f=[['name','اسم المحل',s.rawName&&s.rawName!=='اكتب اسم المحل'?s.rawName:''],['address','العنوان',s.address],['phone','التليفون',s.phone],['currency','العملة',s.currency],['footer','رسالة أسفل الفاتورة',s.footer],['itemPrefix','بادئة كود الصنف',s.itemPrefix],['invPrefix','بادئة رقم الفاتورة',s.invPrefix]];

   '<button class="btn btn-p btn-lg" onclick="saveSet()">'+ic('check')+'حفظ الإعدادات</button></div>';
};
async function saveSet(){
  const d={};['name','address','phone','currency','footer','itemPrefix','invPrefix'].forEach(k=>d[k]=$('#s_'+k).value);
  const r=await run('saveSettings',S.token,d);

/* ======================================================================
   Modal / confirm / ask
   ====================================================================== */
function modal(html,opt){
  opt=opt||{};
  $('#modalRoot').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal'+(opt.wide?' wide':'')+'">'+html+'</div></div>';
}
function closeModal(){stopCam();$('#modalRoot').innerHTML='';}
function confirmBox(msg){
  return new Promise(res=>{
    S._res=res;
    modal('<div class="mb" style="padding-top:24px;text-align:center"><div style="font-size:15.5px;font-weight:700;margin-bottom:20px">'+esc(msg)+'</div><div class="row"><button class="btn btn-g btn-lg" onclick="closeModal();S._res(false)">لا</button><button class="btn btn-p btn-lg" onclick="closeModal();S._res(true)">أيوه</button></div></div>');
  });
}
function askBox(title,fields,okLabel){
  return new Promise(res=>{
    S._res=res;S._fields=fields;
    modal('<div class="mh"><h3>'+esc(title)+'</h3><button class="mini-btn" onclick="closeModal();S._res(null)">'+ic('x')+'</button></div><div class="mb">'+
     fields.map(f=>'<div class="field"><label>'+esc(f.label)+'</label><input class="inp'+(f.type==='number'?' num':'')+'" id="ask_'+f.k+'" type="'+(f.type||'text')+'" step="any" value="'+esc(f.val==null?'':f.val)+'"></div>').join('')+
     '<button class="btn btn-p btn-lg btn-block" onclick="askOk()">'+esc(okLabel||'حفظ')+'</button></div>');
    setTimeout(()=>{const e=$('#ask_'+fields[0].k);if(e){e.focus();e.onkeydown=ev=>{if(ev.key==='Enter')askOk();};}},60);
  });
}
function askOk(){
  const o={};let bad=false;
  S._fields.forEach(f=>{o[f.k]=$('#ask_'+f.k).value.trim();if(!o[f.k]&&f.req!==false&&f.k!=='r')bad=true;});
  if(bad){toast('اكتب القيمة','err');return;}
  closeModal();S._res(o);
}

/* ======================================================================
   Barcode scanner
   ====================================================================== */
let QR=null,scanCb=null,scanBusy=false,scanCtx=null;
function openScanner(ctx){
  scanCtx=ctx;scanBusy=false;
  const formData=ctx==='form'?collectForm():null;
  S._formBackup=formData;
  modal('<div class="mh"><h3>مسح الباركود</h3><button class="mini-btn" onclick="cancelScan()">'+ic('x')+'</button></div><div class="mb">'+
   '<div id="reader"></div>'+
   '<label class="btn btn-soft btn-block" style="margin-top:12px">'+ic('camera')+'صوّر الباركود بالكاميرا<input type="file" accept="image/*" capture="environment" class="hidden" onchange="scanFile(this)"></label>'+
   '<div class="row" style="margin-top:12px;gap:8px"><input class="inp num" id="manualCode" placeholder="أو اكتب الكود / الباركود" onkeydown="if(event.key===\'Enter\')scanDone(this.value)"><button class="btn btn-p" style="flex:0 0 auto" onclick="scanDone($(\'#manualCode\').value)">تمام</button></div></div>');
  startCam();
}
function collectForm(){
  if(!$('#f_name'))return null;
  return {name:$('#f_name').value,cat:$('#f_cat').value,sub:$('#f_sub').value,retail:$('#f_retail').value,whole:$('#f_whole')?$('#f_whole').value:'',img:Object.assign({},S._img),notes:$('#f_notes').value,barcode:$('#f_barcode').value,code:S._formCode};
}
async function startCam(){
  if(!window.Html5Qrcode){camOff();return;}
  try{
    QR=new Html5Qrcode('reader',{verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    await QR.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.floor(Math.min(w*.88,340)),height:Math.floor(Math.min(h*.55,170))})},t=>scanDone(t),()=>{});
  }catch(e){QR=null;camOff();}
}
function camOff(){const r=$('#reader');if(r)r.innerHTML='<div class="cam-off">'+ic('camera')+'<div>الكاميرا المباشرة مش متاحة هنا<br>استخدم زرار "صوّر الباركود" أو اكتب الكود</div></div>';}
function stopCam(){if(QR){const q=QR;QR=null;try{q.stop().then(()=>q.clear()).catch(()=>{});}catch(e){}}}
async function scanFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  if(!window.Html5Qrcode){toast('مكتبة الباركود مش محملة','err');return;}
  loading(true);
  try{const h=new Html5Qrcode('reader-file');const t=await h.scanFile(f,false);scanDone(t);}
  catch(e){toast('معرفتش أقرا الباركود، جرّب صورة أقرب وأوضح','err');}
  finally{loading(false);inp.value='';}
}
function cancelScan(){
  closeModal();
  if(scanCtx==='form'&&S._formBackup)restoreForm(S._formBackup);
}
function restoreForm(b){
  openItemForm(b.code||'');
  setTimeout(()=>{$('#f_name').value=b.name;$('#f_cat').value=b.cat;S._formSub=b.sub;fillSubs();$('#f_retail').value=b.retail;if($('#f_whole'))$('#f_whole').value=b.whole;if(b.img){S._img=b.img;renderImgPrev();}$('#f_notes').value=b.notes;$('#f_barcode').value=b.barcode;},0);
}
function scanDone(text){
  text=String(text||'').trim();
  if(!text||scanBusy)return;
  scanBusy=true;
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  closeModal();
  if(scanCtx==='form'){const b=S._formBackup||{};b.barcode=text;restoreForm(b);toast('اتقرا الباركود','ok');return;}
  const it=exactFind(text);
  if(scanCtx==='inv'){
    if(it&&it.status!=='موقوف'){addToCart(it.code);renderCart();toast('اتضاف: '+it.name,'ok');}
    else toast('الباركود ده مش متسجل على أي صنف','err');
    return;
  }
  if(it){openItem(it.code);return;}
  if(P('editItem')||P('addItem')){
    confirmBox('الباركود '+text+' مش متسجل. تربطه بصنف موجود؟').then(ok=>{if(ok){S.pendingBarcode=text;go('search',{});toast('ابحث عن الصنف وافتحه واضغط "اربط الباركود"');}});
  }else toast('الباركود ده مش متسجل','err');
}

/* keep track of which item is open in the form (for scanner restore) */
const _oif=openItemForm;
openItemForm=function(code){S._formCode=code||'';_oif(code);};

document.addEventListener('click',e=>{const dd=$('#dd');if(dd&&!e.target.closest('.add-box'))dd.classList.add('hidden');});
/* ---------- PWA install ---------- */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;showInstall();});
window.addEventListener('appinstalled',()=>{deferredInstall=null;showInstall();toast('اتثبت التطبيق','ok');});
function showInstall(){document.querySelectorAll('[data-install]').forEach(b=>b.classList.toggle('hidden',!deferredInstall));}
async function installApp(){if(!deferredInstall)return;toggleSb(false);deferredInstall.prompt();try{await deferredInstall.userChoice;}catch(e){}deferredInstall=null;showInstall();}

window.addEventListener('load',boot);
</script>
